<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador Dinâmico de Rompimento de Fibra</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        .painel-controle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 320px;
        }
        .painel-controle h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-calcular {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-calcular:hover {
            background: #0056b3;
        }
        .resultado-alerta {
            margin-top: 15px;
            padding: 10px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            display: none;
        }
        .btn-maps {
            display: block;
            background: #4285F4;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
        .btn-maps:hover {
            background: #357ae8;
        }
    </style>
</head>
<body>

    <div class="painel-controle">
        <h3>⚡ Localizador OTDR</h3>
        <div class="form-group">
            <label for="distanciaInput">Distância do Rompimento (metros):</label>
            <input type="number" id="distanciaInput" placeholder="Ex: 3600" value="3600">
        </div>
        <div class="form-group">
            <label for="margemInput">Margem de Erro (metros):</label>
            <input type="number" id="margemInput" value="20">
        </div>
        <button class="btn-calcular" onclick="processarRompimento()">Calcular Falha</button>

        <div id="resultado" class="resultado-alerta">
            <strong>🚨 Falha Detectada!</strong>
            <p id="infoTrecho" style="margin: 5px 0; font-size: 13px; font-weight: bold; color: #721c24;"></p>
            <p id="infoMetro" style="margin: 5px 0; font-size: 13px; color: #721c24;"></p>
            <p id="infoCoords" style="margin: 5px 0; font-size: 13px; font-family: monospace; color: #721c24;"></p>
            <a id="linkMaps" href="#" target="_blank" class="btn-maps">Abrir no Google Maps</a>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com"></script>
    <script>
        // TABELA COMPLETA COM 25 CEOS
        var historicoRede = [
            {nome: "POP", lat: -21.767498, lon: -41.323909, dist: 0},
            {nome: "CEO 1", lat: -21.768364, lon: -41.319208, dist: 563},
            {nome: "CEO 2", lat: -21.770566, lon: -41.314413, dist: 1304},
            {nome: "CEO 3", lat: -21.779781, lon: -41.304176, dist: 2625},
            {nome: "CEO 4", lat: -21.786765, lon: -41.299826, dist: 3506},
            {nome: "CEO 5", lat: -21.796018, lon: -41.299603, dist: 4830},
            {nome: "CEO 6", lat: -21.800732, lon: -41.298256, dist: 5200},
            {nome: "CEO 7", lat: -21.808306, lon: -41.296134, dist: 6790},
            {nome: "CEO 8", lat: -21.814318, lon: -41.294389, dist: 7300},
            {nome: "CEO 9", lat: -21.818735, lon: -41.294476, dist: 8000},
            {nome: "CEO 10", lat: -21.827977, lon: -41.278078, dist: 9800},
            {nome: "CEO 11", lat: -21.831563, lon: -41.271063, dist: 11910},
            {nome: "CEO 12", lat: -21.855369, lon: -41.241984, dist: 16610},
            {nome: "CEO 13", lat: -21.883558, lon: -41.211603, dist: 21836},
            {nome: "CEO 14", lat: -21.887737, lon: -41.199668, dist: 23271},
            {nome: "CEO 15", lat: -21.880663, lon: -41.191602, dist: 24060},
            {nome: "CEO 16", lat: -21.924544, lon: -41.144648, dist: 31360},
            {nome: "CEO 17", lat: -21.910138, lon: -41.137872, dist: 33490},
            {nome: "CEO 18", lat: -21.907053, lon: -41.124307, dist: 36041},
            {nome: "CEO 19", lat: -21.906017, lon: -41.122693, dist: 36250},
            {nome: "CEO 20", lat: -21.882133, lon: -41.117229, dist: 39880},
            {nome: "CEO 21", lat: -21.866638, lon: -41.083234, dist: 42800},
            {nome: "CEO 22", lat: -21.835863, lon: -41.098580, dist: 47891},
            {nome: "CEO 23", lat: -21.805718, lon: -41.092651, dist: 54086},
            {nome: "CEO 24", lat: -21.808597, lon: -41.097505, dist: 55000},
            {nome: "CEO 25", lat: -21.718439, lon: -41.076572, dist: 67000}
        ];

        // CORRIGIDO: Centraliza o mapa puxando as coordenadas da primeira caixa da lista [0]
        var map = L.map('map').setView([historicoRede[0].lat, historicoRede[0].lon], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Desenha a linha óptica (Linha Azul)
        var rotaCoords = historicoRede.map(function(p) { return [p.lat, p.lon]; });
        L.polyline(rotaCoords, {color: '#007bff', weight: 5, opacity: 0.75}).addTo(map);

        // Adiciona as marcações das caixas fixas no mapa
        historicoRede.forEach(function(ponto) {
            L.marker([ponto.lat, ponto.lon])
                .addTo(map)
                .bindPopup(`<b>${ponto.nome}</b><br>Distância: ${ponto.dist}m`);
        });

        var camadaCirculoFalha = null;
        var camadaMarcadorFalha = null;

        function processarRompimento() {
            var dAlvo = parseFloat(document.getElementById('distanciaInput').value);
            var margem = parseFloat(document.getElementById('margemInput').value) || 0;
            
            if (isNaN(dAlvo) || dAlvo < 0) {
                alert("Por favor, digite uma metragem válida.");
                return;
            }

            if (camadaCirculoFalha) map.removeLayer(camadaCirculoFalha);
            if (camadaMarcadorFalha) map.removeLayer(camadaMarcadorFalha);

            var pAnterior = historicoRede[0];
            var pSeguinte = historicoRede[historicoRede.length - 1];
            var flagEncontrado = false;

            for (var i = 0; i < historicoRede.length - 1; i++) {
                if (historicoRede[i].dist <= dAlvo && dAlvo <= historicoRede[i+1].dist) {
                    pAnterior = historicoRede[i];
                    pSeguinte = historicoRede[i+1];
                    flagEncontrado = true;
                    break;
                }
            }

            if (!flagEncontrado && dAlvo > historicoRede[historicoRede.length - 1].dist) {
                pAnterior = historicoRede[historicoRede.length - 2];
                pSeguinte = historicoRede[historicoRede.length - 1];
            }

            var d1 = pAnterior.dist;
            var d2 = pSeguinte.dist;
            var t = (d2 === d1) ? 0 : (dAlvo - d1) / (d2 - d1);

            var latFalha = pAnterior.lat + t * (pSeguinte.lat - pAnterior.lat);
            var lonFalha = pAnterior.lon + t * (pSeguinte.lon - pAnterior.lon);

            // Adiciona a demarcação vermelha e o marcador
            camadaCirculoFalha = L.circle([latFalha, lonFalha], {
                color: 'red',
                fillColor: '#f03',
                fillOpacity: 0.3,
                radius: margem
            }).addTo(map);

            camadaMarcadorFalha = L.marker([latFalha, lonFalha]).addTo(map)
                .bindPopup(`<b>Ponto Provável</b><br>Distância: ${dAlvo}m`).openPopup();

            map.setView([latFalha, lonFalha], 15);

            // CORRIGIDO: Completa as linhas textuais que estavam cortadas no seu original
            var distDaCaixa = Math.round(dAlvo - pAnterior.dist);

            document.getElementById('infoTrecho').textContent = `Vão: Entre ${pAnterior.nome} e ${pSeguinte.nome}`;
            document.getElementById('infoMetro').textContent = `Distância da ${pAnterior.nome}: ${distDaCaixa}m adiante`;
            document.getElementById('infoCoords').textContent = `${latFalha.toFixed(6)}, ${lonFalha.toFixed(6)}`;
            document.getElementById('linkMaps').href = `https://google.com{latFalha},${lonFalha}`;
            document.getElementById('resultado').style.display = 'block';
        }
    </script>
</body>
</html>
