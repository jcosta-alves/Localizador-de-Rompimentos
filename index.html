<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador Dinâmico de Rompimento de Fibra</title>
    
    <!-- Leaflet CSS - Links Oficiais e Corretos -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        .painel-controle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 320px;
        }
        .painel-controle h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-calcular {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-calcular:hover {
            background: #0056b3;
        }
        .resultado-alerta {
            margin-top: 15px;
            padding: 10px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            display: none;
        }
        .btn-maps {
            display: block;
            background: #4285F4;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
        .btn-maps:hover {
            background: #357ae8;
        }
    </style>
</head>
<body>

    <div class="painel-controle">
        <h3>⚡ Localizador OTDR</h3>
        
        <div class="form-group">
            <label for="rotaSelect">Selecione a Rota/Anel:</label>
            <select id="rotaSelect" onchange="carregarRotaNoMapa()">
                <!-- Opções injetadas automaticamente -->
            </select>
        </div>

        <div class="form-group">
            <label for="distanciaInput">Distância do Rompimento (metros):</label>
            <input type="number" id="distanciaInput" placeholder="Ex: 3600" value="3600">
        </div>
        <div class="form-group">
            <label for="margemInput">Margem de Erro (metros):</label>
            <input type="number" id="margemInput" value="20">
        </div>
        <button class="btn-calcular" onclick="processarRompimento()">Calcular Falha</button>

        <div id="resultado" class="resultado-alerta">
            <strong>🚨 Falha Detectada!</strong>
            <p id="infoTrecho" style="margin: 5px 0; font-size: 13px;"></p>
            <p id="infoCoords" style="margin: 5px 0; font-size: 13px; font-family: monospace;"></p>
            <a id="linkMaps" href="#" target="_blank" class="btn-maps">Abrir no Google Maps</a>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS - Links Oficiais e Corretos -->
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Chamada do arquivo de dados externo -->
    <script src="rota.js"></script>

    <script>
        // Inicialização do mapa base focado na região
        var map = L.map('map').setView([-21.767498, -41.323909], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var camadaPolilinha = null;
        var grupoMarcadoresCeo = L.layerGroup().addTo(map);
        var camadaCirculoFalha = null;
        var camadaMarcadorFalha = null;

        // Identifica e injeta as chaves do arquivo rota.js no select
        var selectElement = document.getElementById('rotaSelect');
        if (typeof bancoDeRotas !== 'undefined') {
            Object.keys(bancoDeRotas).forEach(function(nomeRota) {
                var option = document.createElement('option');
                option.value = nomeRota;
                option.textContent = nomeRota;
                selectElement.appendChild(option);
            });
        } else {
            alert("Erro crítico: O arquivo 'rota.js' não foi detectado ou está mal estruturado.");
        }

        function carregarRotaNoMapa() {
            var nomeRota = selectElement.value;
            if (!nomeRota) return;
            
            var rotaAtual = bancoDeRotas[nomeRota];

            if (camadaPolilinha) map.removeLayer(camadaPolilinha);
            grupoMarcadoresCeo.clearLayers();
            if (camadaCirculoFalha) map.removeLayer(camadaCirculoFalha);
            if (camadaMarcadorFalha) map.removeLayer(camadaMarcadorFalha);
            document.getElementById('resultado').style.display = 'none';

            if (!rotaAtual || rotaAtual.length === 0) return;

            var rotaCoords = rotaAtual.map(function(p) { return [p.lat, p.lon]; });
            camadaPolilinha = L.polyline(rotaCoords, {color: '#007bff', weight: 5, opacity: 0.75}).addTo(map);

            map.fitBounds(camadaPolilinha.getBounds());

            rotaAtual.forEach(function(ponto) {
                L.marker([ponto.lat, ponto.lon])
                    .addTo(grupoMarcadoresCeo)
                    .bindPopup(`<b>${ponto.nome}</b><br>Distância: ${ponto.dist}m`);
            });
        }

        function processarRompimento() {
            var nomeRota = selectElement.value;
            var historicoRede = bancoDeRotas[nomeRota];
            
            var dAlvo = parseFloat(document.getElementById('distanciaInput').value);
            var margem = parseFloat(document.getElementById('margemInput').value) || 0;
            
            if (isNaN(dAlvo) || dAlvo < 0) {
                alert("Por favor, preencha uma metragem correta.");
                return;
            }

            if (!historicoRede || historicoRede.length === 0) return;

            if (camadaCirculoFalha) map.removeLayer(camadaCirculoFalha);
            if (camadaMarcadorFalha) map.removeLayer(camadaMarcadorFalha);

            var pAnterior = historicoRede[0];
            var pSeguinte = historicoRede[historicoRede.length - 1];
            var flagEncontrado = false;

            for (var i = 0; i < historicoRede.length - 1; i++) {
                var pontoAtual = historicoRede[i];
                var pontoProximo = historicoRede[i + 1];

                if (pontoAtual.dist <= dAlvo && dAlvo <= pontoProximo.dist) {
                    pAnterior = pontoAtual;
                    pSeguinte = pontoProximo;
                    flagEncontrado = true;
                    break;
                }
            }

            if (!flagEncontrado && dAlvo > pSeguinte.dist) {
                pAnterior = historicoRede[historicoRede.length - 2];
                pSeguinte = historicoRede[historicoRede.length - 1];
            }

            var d1 = pAnterior.dist;
            var d2 = pSeguinte.dist;
            var t = (d2 === d1) ? 0 : (dAlvo - d1) / (d2 - d1);

            var latFalha = pAnterior.lat + (pSeguinte.lat - pAnterior.lat) * t;
            var lonFalha = pAnterior.lon + (pSeguinte.lon - pAnterior.lon) * t;

            camadaCirculoFalha = L.circle([latFalha, lonFalha], {
                color: 'red',
                fillColor: '#f03',
                fillOpacity: 0.3,
                radius: margem
            }).addTo(map);

            // Marcador padrão Leaflet para evitar erros de caminhos de imagens externas
            camadaMarcadorFalha = L.marker([latFalha, lonFalha]).addTo(map)
                .bindPopup(`<b>Ponto Provável do Rompimento</b><br>OTDR: ${dAlvo}m`).openPopup();

            map.setView([latFalha, lonFalha], 15);

            document.getElementById('infoTrecho').textContent = `Trecho aproximado: Entre ${pAnterior.nome} e ${pSeguinte.nome}`;
            document.getElementById('infoCoords').textContent = `${latFalha.toFixed(6)}, ${lonFalha.toFixed(6)}`;
            document.getElementById('linkMaps').href = `https://google.com{latFalha},${lonFalha}`;
            document.getElementById('resultado').style.display = 'block';
        }

        // Executa o carregamento inicial da rota ativa
        carregarRotaNoMapa();
    </script>
</body>
</html>
