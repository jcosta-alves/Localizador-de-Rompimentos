        .painel-controle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 320px;
        }
        .painel-controle h3 {

            color: #333;

            padding-bottom: 5px;
        }
        .form-group {

            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-calcular {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-calcular:hover {

        }
        .resultado-alerta {
            margin-top: 15px;
            padding: 10px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;

            margin-top: 10px;

</head>
